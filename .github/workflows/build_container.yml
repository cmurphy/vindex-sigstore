name: Build and publish vindexd and mapfn artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository }}

permissions: {}

concurrency:
  group: "build-container-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-push-vindexd:
    name: Build and push vindexd image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for vindexd
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Set build arguments
        run: |
          LDFLAGS=$(make ldflags)
          echo "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV

      - name: Build and push per-commit vindexd image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: push-per-commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: local-deploy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_LDFLAGS=${{ env.LDFLAGS }}

      - name: Build and push per-tag vindexd image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: push-per-tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: deploy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_LDFLAGS=${{ env.LDFLAGS }}

      - name: Generate artifact attestation (per-commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd
          subject-digest: ${{ steps.push-per-commit.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation (per-tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/vindexd
          subject-digest: ${{ steps.push-per-tag.outputs.digest }}
          push-to-registry: true

  build-and-publish-mapfn:
    name: Build and publish mapfn-${{ matrix.mapfn }} WASM artifact and image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mapfn:
          - hashedrekord
          - identity
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Extract mapper-${{ matrix.mapfn }}.wasm from artifact stage
        run: |
          mkdir -p bin
          docker buildx build \
            --file Dockerfile.mapfn \
            --build-arg MAPFN_TYPE=${{ matrix.mapfn }} \
            --target artifact \
            --output type=local,dest=bin \
            .
          mv bin/mapper.wasm "bin/mapper-${{ matrix.mapfn }}.wasm"
          (cd bin && sha256sum "mapper-${{ matrix.mapfn }}.wasm" > "mapper-${{ matrix.mapfn }}.wasm.sha256")

      - name: Generate SLSA build provenance attestation for mapper-${{ matrix.mapfn }}.wasm
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/mapper-${{ matrix.mapfn }}.wasm

      - name: Upload mapper-${{ matrix.mapfn }}.wasm workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mapper-${{ matrix.mapfn }}-wasm
          path: |
            bin/mapper-${{ matrix.mapfn }}.wasm
            bin/mapper-${{ matrix.mapfn }}.wasm.sha256

      - name: Publish mapper-${{ matrix.mapfn }}.wasm to GitHub Release (on tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WASM="bin/mapper-${{ matrix.mapfn }}.wasm"
          SUM="bin/mapper-${{ matrix.mapfn }}.wasm.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${WASM}" "${SUM}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${WASM}" "${SUM}" --generate-notes || \
              gh release upload "${GITHUB_REF_NAME}" "${WASM}" "${SUM}" --clobber
          fi

      - name: Extract metadata (tags, labels) for mapfn-${{ matrix.mapfn }} image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/mapfn-${{ matrix.mapfn }}

      - name: Build and push mapfn-${{ matrix.mapfn }} image
        id: push-mapfn
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.mapfn
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAPFN_TYPE=${{ matrix.mapfn }}

      - name: Generate artifact attestation for mapfn-${{ matrix.mapfn }} image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}/mapfn-${{ matrix.mapfn }}
          subject-digest: ${{ steps.push-mapfn.outputs.digest }}
          push-to-registry: true
